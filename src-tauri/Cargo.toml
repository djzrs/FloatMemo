[package]
name = "floatmemo"
version = "0.2.1"
description = "浮笺 · Windows 悬浮速记便签"
authors = ["FloatMemo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "floatmemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
mysql = { version = "25", default-features = false, features = ["rustls-tls"] }
# mysql 依赖链会带上 flate2，但没选压缩后端，这里显式用纯 Rust 实现
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
