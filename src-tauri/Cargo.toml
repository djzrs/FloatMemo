[package]
name = "floatmemo"
version = "0.1.0"
description = "浮笺 · Windows 悬浮速记便签"
authors = ["FloatMemo"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "floatmemo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "z"
strip = true
panic = "abort"
codegen-units = 1
