name: 功能建议
description: 提出一个新想法或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚使用场景，这能帮助我们判断优先级。
  - type: textarea
    id: problem
    attributes:
      label: 解决了什么问题？
      description: 你在什么场景下遇到了什么不便？
      placeholder: 每次…… 时，我都要……，很麻烦。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望怎么解决？
      placeholder: 希望能……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 有没有考虑过其他做法？
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考的其它应用、截图、链接等