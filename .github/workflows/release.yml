name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag（留空则用 v0.1.0）'
        required: false
        default: 'v0.1.0'

jobs:
  build:
    name: Windows 打包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装依赖
        run: npm ci

      - name: 打包 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'FloatMemo ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: 'Windows 悬浮便签 · 悬浮球速记'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: 上传免安装版到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $exe = Get-Item src-tauri/target/x86_64-pc-windows-msvc/release/floatmemo.exe
          Copy-Item $exe.FullName src-tauri/target/FloatMemo-portable.exe
          gh release upload $env:TAG src-tauri/target/FloatMemo-portable.exe --clobber --repo $env:GITHUB_REPOSITORY

      - name: 上传构建产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floatmemo-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/floatmemo.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/FloatMemo-portable.exe
          if-no-files-found: error
